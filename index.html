<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Боты и сайты на заказ — портфолио разработчика</title>
<style>
 
/* ============ TOKENS ============ */
:root{
  --bg-0:#eef2f1;
  --bg-1:#e2ebe9;
  --glass:rgba(255,255,255,0.40);
  --glass-strong:rgba(255,255,255,0.60);
  --glass-border:rgba(255,255,255,0.55);
  --ink:#16221f;
  --ink-soft:#4a5f5a;
  --ink-faint:#7c9490;
  --accent:#14A98D;
  --accent-2:#3F8FE0;
  --accent-3:#5CD9BE;
  --accent-rgb:20,169,141;
  --accent2-rgb:63,143,224;
  --shadow-glass:0 8px 32px rgba(20,45,66,0.16);
  --blob-opacity:0.38;
  --radius-lg:28px;
  --radius-md:20px;
  --radius-sm:14px;
  color-scheme:light;
}
 
:root[data-theme="dark"]{
  --bg-0:#1E1E1E;
  --bg-1:#181818;
  --glass:rgba(255,255,255,0.055);
  --glass-strong:rgba(255,255,255,0.10);
  --glass-border:rgba(47,214,181,0.16);
  --ink:#2FD6B5;
  --ink-soft:#8fc4b9;
  --ink-faint:#5c7a73;
  --accent:#2FD6B5;
  --accent-2:#4FA6E0;
  --accent-3:#6EE7C0;
  --accent-rgb:47,214,181;
  --accent2-rgb:79,166,224;
  --shadow-glass:0 8px 36px rgba(0,0,0,0.5);
  --blob-opacity:0.24;
  color-scheme:dark;
}
 
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;
  color:var(--ink);
  background:var(--bg-0);
  overflow-x:hidden;
  transition:background .5s ease, color .5s ease;
}
 
::selection{background:rgba(40,168,234,0.25);}
 
:focus-visible{
  outline:2.5px solid var(--accent);
  outline-offset:3px;
  border-radius:6px;
}
 
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}
 
h1,h2,h3,p{margin:0;}
 
.wrap{
  max-width:1120px;
  margin:0 auto;
  padding:0 32px;
}
 
/* ============ LIQUID BACKGROUND ============ */
.liquid-bg{
  position:fixed;
  inset:0;
  z-index:0;
  overflow:hidden;
  background:linear-gradient(180deg,var(--bg-0) 0%, var(--bg-1) 100%);
  transition:background .5s ease;
}
.blob{
  position:absolute;
  filter:blur(70px);
  opacity:var(--blob-opacity);
  will-change:transform, border-radius;
  transition:opacity .5s ease;
}
.blob-a{
  width:46vw;height:46vw;
  top:-12vw;left:-10vw;
  background:radial-gradient(circle at 30% 30%, var(--accent), transparent 70%);
  border-radius:42% 58% 65% 35% / 45% 40% 60% 55%;
  animation:drift1 26s ease-in-out infinite alternate;
}
.blob-b{
  width:38vw;height:38vw;
  top:20vh;right:-12vw;
  background:radial-gradient(circle at 60% 40%, var(--accent-2), transparent 72%);
  border-radius:60% 40% 35% 65% / 55% 65% 35% 45%;
  animation:drift2 32s ease-in-out infinite alternate;
}
.blob-c{
  width:34vw;height:34vw;
  bottom:-8vw;left:18vw;
  background:radial-gradient(circle at 50% 50%, var(--accent-3), transparent 70%);
  border-radius:50% 50% 40% 60% / 60% 40% 60% 40%;
  animation:drift3 38s ease-in-out infinite alternate;
}
@keyframes drift1{
  0%{transform:translate(0,0) rotate(0deg);border-radius:42% 58% 65% 35% / 45% 40% 60% 55%;}
  100%{transform:translate(6vw,8vh) rotate(25deg);border-radius:55% 45% 40% 60% / 50% 60% 40% 50%;}
}
@keyframes drift2{
  0%{transform:translate(0,0) rotate(0deg);}
  100%{transform:translate(-7vw,10vh) rotate(-20deg);}
}
@keyframes drift3{
  0%{transform:translate(0,0) scale(1);}
  100%{transform:translate(5vw,-6vh) scale(1.08);}
}
 
@media (prefers-reduced-motion:reduce){
  .blob{animation:none !important;}
  html{scroll-behavior:auto;}
}
 
/* ============ GLASS PANEL BASE ============ */
.glass{
  background:var(--glass);
  backdrop-filter:blur(22px) saturate(160%);
  -webkit-backdrop-filter:blur(22px) saturate(160%);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-glass);
  transition:background .5s ease, border-color .5s ease, box-shadow .5s ease;
}
 
/* ============ NAV DOCK ============ */
.dock{
  position:fixed;
  z-index:50;
  right:28px;
  top:50%;
  transform:translateY(-50%);
  display:flex;
  flex-direction:column;
  gap:6px;
  padding:10px;
  background:var(--glass-strong);
  backdrop-filter:blur(26px) saturate(180%);
  -webkit-backdrop-filter:blur(26px) saturate(180%);
  border:1px solid var(--glass-border);
  border-radius:999px;
  box-shadow:var(--shadow-glass);
}
.dock-item{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  width:42px;
  height:42px;
  border-radius:50%;
  background:transparent;
  border:none;
  cursor:pointer;
  transition:background .25s ease;
}
.dock-item:hover{background:rgba(255,255,255,0.5);}
.dock-dot{
  width:8px;height:8px;
  border-radius:50%;
  background:var(--ink-faint);
  transition:all .3s ease;
}
.dock-item.active .dock-dot{
  background:var(--accent);
  width:10px;height:10px;
  box-shadow:0 0 0 5px rgba(40,168,234,0.18);
}
.dock-label{
  position:absolute;
  right:54px;
  top:50%;
  transform:translateY(-50%) translateX(6px);
  white-space:nowrap;
  font-size:13px;
  font-weight:600;
  padding:7px 14px;
  border-radius:999px;
  background:var(--glass-strong);
  backdrop-filter:blur(20px);
  border:1px solid var(--glass-border);
  color:var(--ink);
  opacity:0;
  pointer-events:none;
  transition:opacity .2s ease, transform .2s ease;
  box-shadow:var(--shadow-glass);
}
.dock-item:hover .dock-label,
.dock-item:focus-visible .dock-label{
  opacity:1;
  transform:translateY(-50%) translateX(0);
}
 
/* ============ THEME TOGGLE ============ */
.theme-toggle{
  position:fixed;
  z-index:50;
  top:24px;
  right:28px;
  width:52px;
  height:52px;
  border-radius:50%;
  border:1px solid var(--glass-border);
  background:var(--glass-strong);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  box-shadow:var(--shadow-glass);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  transition:background .5s ease, border-color .5s ease, transform .3s ease;
}
.theme-toggle:hover{transform:translateY(-2px) scale(1.04);}
.theme-toggle:active{transform:scale(0.92);}
.theme-toggle svg{
  width:22px;
  height:22px;
  stroke:var(--ink);
  position:absolute;
  transition:opacity .4s ease, transform .5s ease;
}
.icon-sun{opacity:1;transform:rotate(0deg) scale(1);}
.icon-moon{opacity:0;transform:rotate(-90deg) scale(0.5);}
:root[data-theme="dark"] .icon-sun{opacity:0;transform:rotate(90deg) scale(0.5);}
:root[data-theme="dark"] .icon-moon{opacity:1;transform:rotate(0deg) scale(1);}
 
@media (max-width:820px){
  .theme-toggle{
    top:18px;
    right:18px;
    width:46px;
    height:46px;
  }
  .dock{
    right:50%;
    top:auto;
    bottom:18px;
    transform:translateX(50%);
    flex-direction:row;
  }
  .dock-label{
    right:auto;
    bottom:56px;
    top:auto;
    left:50%;
    transform:translateX(-50%) translateY(6px);
  }
  .dock-item:hover .dock-label,
  .dock-item:focus-visible .dock-label{
    transform:translateX(-50%) translateY(0);
  }
}
 
/* ============ SIDE SHOWCASE PANELS ============ */
.side-panel{
  position:fixed;
  top:50%;
  width:230px;
  height:440px;
  z-index:2;
  transition:opacity .9s ease;
}
@media (min-width:1680px){
  .side-panel{display:block;}
}
.side-panel-left{
  left:36px;
  transform:translateY(-50%);
}
.side-panel-right{
  right:36px;
  transform:translateY(-50%);
}
.panel-window{
  width:100%;
  height:100%;
  border-radius:16px;
  overflow:hidden;
  background:var(--glass-strong);
  border:1px solid var(--glass-border);
  backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  box-shadow:var(--shadow-glass);
  display:flex;
  flex-direction:column;
  transition:background .5s ease, border-color .5s ease;
}
.panel-titlebar{
  display:flex;
  align-items:center;
  gap:6px;
  padding:10px 12px;
  background:rgba(0,0,0,0.045);
  border-bottom:1px solid var(--glass-border);
  cursor: move;
  user-select: none;
}
</style>
</head>
<body>

<div class="liquid-bg">
  <div class="blob blob-a"></div>
  <div class="blob blob-b"></div>
  <div class="blob blob-c"></div>
</div>

<!-- ЛЕВАЯ ПАНЕЛЬ -->
<div class="side-panel side-panel-left">
  <div class="panel-window">
    <div class="panel-titlebar">
      <span style="width:8px;height:8px;border-radius:50%;background:#ff5f57;"></span>
      <span style="width:8px;height:8px;border-radius:50%;background:#febc2e;"></span>
      <span style="width:8px;height:8px;border-radius:50%;background:#28c840;"></span>
      <span style="margin-left:6px;font-size:12px;opacity:0.7;">bot.py</span>
    </div>
    <!-- Имитация кода внутри левой панели -->
    <div style="padding:15px;font-family:monospace;font-size:11px;color:var(--ink-soft);line-height:1.5;">
      <span style="color:#ff79c6;">import</span> aiogram<br>
      bot = Bot(token=<span style="color:#f1fa8c;">"TOKEN"</span>)<br>
      dp = Dispatcher(bot)<br><br>
      <span style="color:#8be9fd;">@dp.message_handler</span>()<br>
      <span style="color:#ff79c6;">async def</span> echo(msg):<br>
      &nbsp;&nbsp;<span style="color:#ff79c6;">await</span> msg.answer(<span style="color:#f1fa8c;">"Привет!"</span>)
    </div>
  </div>
</div>

<!-- ПРАВАЯ ПАНЕЛЬ (ТЕПЕРЬ С ЧИСТЫМ КАНВАСОМ) -->
<div class="side-panel side-panel-right">
  <div class="panel-window">
    <div class="panel-titlebar">
      <span style="width:8px;height:8px;border-radius:50%;background:#ff5f57;"></span>
      <span style="width:8px;height:8px;border-radius:50%;background:#febc2e;"></span>
      <span style="width:8px;height:8px;border-radius:50%;background:#28c840;"></span>
      <span style="margin-left:6px;font-size:12px;opacity:0.7;">yoursite.ru</span>
    </div>
    <!-- Сюда можно загружать другой ваш проект, пока тут пустое прозрачное окно -->
    <iframe src="about:blank" style="width: 100%; height: 100%; border: none; background: transparent; pointer-events: none;"></iframe>
  </div>
</div>

<!-- ЦЕНТРАЛЬНЫЙ КОНТЕНТ -->
